# This replaces kubernetes/helm/templates/ingress.yaml
# Uses Traefik's native CRD instead of the generic Ingress — gives you middleware support

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hello-bank-route
  namespace: hello-bank
spec:
  entryPoints:
    - web        # port 80

  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: hello-bank-svc
          port: 80
      middlewares:
        - name: rate-limit     # apply rate limiting to all routes